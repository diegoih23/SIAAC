; SIAAC - Firmware ESP32 (PlatformIO)
; Placa: ESP32 DevKit V1 / WROOM-32
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
    mathieucarbou/ESPAsyncWebServer@^3.6

; Para tarjetas con PSRAM (recomendado si se procesa video en el ESP32-CAM)
; board_build.psram = enable
