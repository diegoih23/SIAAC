name: siaac

services:
  db:
    image: mariadb:11.4
    container_name: siaac-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_siaac
      MARIADB_DATABASE: siaac_db
      MARIADB_USER: siaac_user
      MARIADB_PASSWORD: siaac_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Descomentar solo si se desea cargar el esquema de referencia al crear el volumen:
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: siaac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siaac-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: dev-secret-key-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: siaac_db
      DB_USER: siaac_user
      DB_PASSWORD: siaac_password
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEVICE_API_KEY: demo-api-key-esp32-001
      MQTT_BROKER_HOST: host.docker.internal
      MQTT_BROKER_PORT: "1883"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siaac-frontend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: /api/v1
      VITE_WS_URL: ws://localhost:8000
      VITE_APP_NAME: SIAAC
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    container_name: siaac-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  mariadb_data:
  redis_data:
  media_data:
  frontend_node_modules:
