# SIAAC - configuración de referencia para Nginx (producción)
upstream siaac_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name siaac.ejemplo.com;

    client_max_body_size 20M;

    # Frontend compilado con `npm run build`
    root /var/www/siaac/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://siaac_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://siaac_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        alias /var/www/siaac/backend/media/;
        expires 7d;
    }

    location /static/ {
        alias /var/www/siaac/backend/staticfiles/;
        expires 30d;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
